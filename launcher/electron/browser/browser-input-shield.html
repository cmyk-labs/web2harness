<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'">
  <title>Web2Harness observation guard</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; cursor: not-allowed; user-select: none; touch-action: none; }
    body { font: 14px/1.6 system-ui, -apple-system, 'Segoe UI', sans-serif; color: #e6e9ed; }
    #notice { position: absolute; right: 16px; top: 16px; width: min(360px, calc(100% - 32px)); padding: 14px 16px; border: 1px solid #63768c; border-radius: 10px; background: rgba(27,31,36,.97); box-shadow: 0 6px 24px #0005; }
    strong { display: block; font-size: 14px; font-weight: 600; }
    p { margin: 6px 0 0; color: #b9c0c9; }
    #notice.attempted { border-color: #a8c9ee; box-shadow: 0 0 0 2px #a8c9ee44, 0 6px 24px #0005; }
    @media (prefers-reduced-motion: no-preference) { #notice { transition: border-color .15s, box-shadow .15s; } }
  </style>
</head>
<body>
  <aside id="notice" role="status" aria-live="polite"><strong id="title"></strong><p id="message"></p></aside>
  <script src="browser-input-shield.js"></script>
</body>
</html>
