<text x="261" y="111" font-size="16" fill="#18324F" font-weight="600" text-anchor="start" data-fit="runtime label" data-fit-x="259" data-fit-y="95" data-fit-width="477" data-fit-height="605">Local integration services and processes</text></g>
<g id="desktop" data-group="desktop"><rect x="780" y="85" width="210" height="200" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
<text x="796" y="111" font-size="16" fill="#18324F" font-weight="600" text-anchor="start" data-fit="desktop label" data-fit-x="794" data-fit-y="95" data-fit-width="182" data-fit-height="180">Desktop application</text></g>
