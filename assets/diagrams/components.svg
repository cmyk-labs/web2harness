<g data-edge-label="tool-items"><rect x="407.17" y="292" width="179.66" height="26" fill="#FFFFFF"/>
<text x="497" y="309" font-size="14" fill="#334155" font-weight="400" text-anchor="middle" data-fit="tool-items label" data-fit-x="397" data-fit-y="295" data-fit-width="200" data-fit-height="20">Tool requests / receipts</text></g>
<line x1="24" y1="743" x2="976" y2="743" stroke="#CBD5E1"/>
<text x="26" y="769" font-size="14" fill="#64748B" font-weight="400" text-anchor="start" data-fit="note 1" data-fit-x="24" data-fit-y="755" data-fit-width="952" data-fit-height="78">Native Tools uses the adapter and Responses path. MCP Bridge additionally uses the connector, tunnel, MCP service and turn broker.</text>
<text x="26" y="795" font-size="14" fill="#64748B" font-weight="400" text-anchor="start" data-fit="note 2" data-fit-x="24" data-fit-y="755" data-fit-width="952" data-fit-height="78">The lower arrows show application calls and results, not network connection initiation. The tunnel client connects outbound.</text>
<text x="26" y="821" font-size="14" fill="#64748B" font-weight="400" text-anchor="start" data-fit="note 3" data-fit-x="24" data-fit-y="755" data-fit-width="952" data-fit-height="78">Both paths return tool requests to Codex through Responses. The browser and connector grant no additional local authority.</text>
</svg>
