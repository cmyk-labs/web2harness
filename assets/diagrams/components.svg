<text x="885" y="500.5" font-size="15" fill="#334155" font-weight="400" text-anchor="middle" data-fit="chatgpt body" data-fit-x="809" data-fit-y="405" data-fit-width="152" data-fit-height="110">connector</text></g>
<g data-edge-label="codex-api"><rect x="215.17" y="182" width="39.66" height="26" fill="#FFFFFF"/>
<text x="235" y="199" font-size="14" fill="#334155" font-weight="400" text-anchor="middle" data-fit="codex-api label" data-fit-x="212.5" data-fit-y="185" data-fit-width="45" data-fit-height="20">API</text></g>
<g data-edge-label="host-control"><rect x="728.28" y="172" width="57.44" height="46" fill="#FFFFFF"/>
<text x="757" y="189" font-size="14" fill="#334155" font-weight="400" text-anchor="middle" data-fit="host-control label" data-fit-x="727" data-fit-y="175" data-fit-width="60" data-fit-height="40">CDP /</text>
