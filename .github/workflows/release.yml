name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
          - runner: macos-15-intel
          - runner: ubuntu-latest
          - runner: ubuntu-24.04-arm
          - runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate executable shell entry points
        if: runner.os == 'Linux'
        shell: bash
        run: |
          git ls-files -z -- '*.sh' | while IFS= read -r -d '' script; do
            if [ ! -x "$script" ]; then
              printf 'Shell entry point is not executable: %s\n' "$script" >&2
              exit 1
            fi
          done
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: launcher
      - name: Prepare AVX2-independent Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/prepare-windows-baseline-bun.ps1 -Version 1.4.0 -GitHubEnv $env:GITHUB_ENV
      - name: Prepare compatible Linux libnotify
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config libglib2.0-dev libgdk-pixbuf-2.0-dev binutils
          ./scripts/prepare-linux-libnotify.sh
      - name: Prepare owned AppImage toolset
        if: runner.os == 'Linux'
        run: bun run launcher/scripts/prepare-linux-appimage-tools.cjs
      - run: bun run verify
      - name: Prepare pinned license public keys
        run: bun run scripts/prepare-license-public-keys.ts
        env:
          WEB2HARNESS_LICENSE_PUBLIC_KEYS_JSON: ${{ vars.WEB2HARNESS_LICENSE_PUBLIC_KEYS_JSON }}
      - run: bun run app:package
        env:
          WEB2HARNESS_REPOSITORY: ${{ github.repository }}
          WEB2HARNESS_LICENSE_KEYS_FILE: ${{ github.workspace }}/output/release-keys/public-keys.json
      - name: Verify Linux AppImage ABI on current Arch
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          artifact="$(find launcher/artifacts -maxdepth 1 -name '*-linux-x64.AppImage' -print -quit)"
          test -n "$artifact"
          docker run --rm -v "$PWD:/work:ro" -e APPIMAGE_PATH="/work/$artifact" archlinux:base \
            sh -lc 'pacman -Sy --noconfirm binutils file glibc alsa-lib at-spi2-core cairo cups gtk3 libx11 libxcb libxcomposite libxdamage libxext libxfixes libxkbcommon libxrandr mesa nspr nss pango >/dev/null && /work/launcher/scripts/smoke-linux-appimage-symbols.sh "$APPIMAGE_PATH"'
      - name: Ensure virtual display is available
        if: runner.os == 'Linux'
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      - run: bun run app:smoke
        id: package_smoke
      - name: Upload package smoke diagnostics
        if: failure() && steps.package_smoke.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: package-smoke-${{ matrix.runner }}-${{ github.run_attempt }}
          path: output/package-smoke/
          retention-days: 7
          if-no-files-found: warn
      - name: Verify embedded macOS runtime signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict launcher/build/runtime/runtime/bun
      - name: Verify packaged macOS application signature
        if: runner.os == 'macOS'
        run: |
          archive="$(find launcher/artifacts -maxdepth 1 -name '*-mac-*.zip' -print -quit)"
          test -n "$archive"
          stage="$(mktemp -d)"
          ditto -x -k "$archive" "$stage"
          codesign --verify --deep --strict --verbose=2 "$stage/Web2Harness.app"
      - name: Verify terminal installation from the macOS desktop archive
        if: runner.os == 'macOS'
        run: node launcher/scripts/smoke-cli-install.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.runner }}
          path: |
            launcher/artifacts/*.dmg
            launcher/artifacts/*.zip
            launcher/artifacts/*.exe
            launcher/artifacts/*.AppImage
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: launcher
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true
      - name: Verify release tag matches package version
        run: |
          expected="v$(jq -r .version package.json)"
          test "$GITHUB_REF_NAME" = "$expected"
      - name: Flatten release assets
        run: |
          cd release-assets
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            if [ -e "$name" ]; then
              echo "Duplicate release asset name: $name" >&2
              exit 1
            fi
            mv "$file" "$name"
          done < <(find . -mindepth 2 -type f -print0 | sort -z)
          find . -mindepth 1 -type d -empty -delete
      - name: Verify the public asset inventory
        run: bun run scripts/check-release-assets.ts release-assets "${GITHUB_REF_NAME#v}"
      - name: Create checksums
        run: |
          cd release-assets
          checksum_file="$(mktemp)"
          find . -maxdepth 1 -type f ! -name checksums.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  \./#  #' > "$checksum_file"
          mv "$checksum_file" checksums.txt
      - name: Verify every built asset is checksummed
        run: |
          cd release-assets
          missing=""
          while IFS= read -r -d '' file; do
            name="${file#./}"
            if [ "$name" = checksums.txt ]; then continue; fi
            if ! awk -v asset="$name" '$2 == asset { found = 1 } END { exit found ? 0 : 1 }' checksums.txt; then
              missing="$missing $name"
            fi
          done < <(find . -type f -print0)
          if [ -n "$missing" ]; then
            echo "checksums.txt is missing entries for:$missing" >&2
            exit 1
          fi
      - name: Plan publication and protect existing stable releases
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
          REPLACE_PREVIEW: ${{ github.event.forced || false }}
        run: bun run scripts/plan-release.ts
      - name: Preserve previous release before replacement
        if: steps.publication.outputs.replace == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir previous-release
          cp previous-release.json previous-release/metadata.json
          if jq -e '.assets | length > 0' previous-release.json >/dev/null; then
            gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir previous-release
          fi
          if [ -f previous-release/checksums.txt ]; then
            (cd previous-release && sha256sum --check checksums.txt)
          fi
      - name: Archive previous publication
        if: steps.publication.outputs.replace == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: previous-release-${{ github.ref_name }}-${{ github.run_id }}
          path: previous-release/
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
      - name: Prepare replacement as a draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPLACE_RELEASE: ${{ steps.publication.outputs.replace }}
          PREVIOUS_RELEASE_ID: ${{ steps.publication.outputs.previousId }}
          IS_PRERELEASE: ${{ steps.publication.outputs.prerelease }}
        run: |
          mapfile -d '' release_files < <(find release-assets -type f -print0)
          test "${#release_files[@]}" -eq 8
          if [ "$REPLACE_RELEASE" = true ]; then
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" > current-release.json
            test "$(jq -r .id current-release.json)" = "$PREVIOUS_RELEASE_ID"
            jq -e '.immutable != true and (.draft == true or .prerelease == true)' current-release.json >/dev/null
            gh release delete "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --yes
          fi
          gh release create "$GITHUB_REF_NAME" "${release_files[@]}" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "Web2Harness ${GITHUB_REF_NAME#v}" \
            --prerelease="$IS_PRERELEASE" --latest=false \
            --notes-file .github/release-notes.md
      - name: Verify uploaded assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ steps.publication.outputs.prerelease }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets > published-assets.json
          test "$(jq '.assets | length' published-assets.json)" -eq 8
          diff <(find release-assets -type f -printf '%f\n' | sort) <(jq -r '.assets[].name' published-assets.json | sort)
          while IFS=$'\t' read -r name digest; do
            if [ "$name" = checksums.txt ]; then continue; fi
            expected="$(awk -v asset="$name" '$2 == asset { print $1 }' release-assets/checksums.txt)"
            if [ -z "$expected" ] || [ "sha256:$expected" != "$digest" ]; then
              echo "Published asset checksum mismatch: $name" >&2
              exit 1
            fi
          done < <(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[] | [.name, .digest] | @tsv')

          local_manifest_digest="$(sha256sum release-assets/checksums.txt | awk '{ print $1 }')"
          remote_manifest_digest="$(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[] | select(.name == "checksums.txt") | .digest')"
          test "sha256:$local_manifest_digest" = "$remote_manifest_digest"

          latest=true
          if [ "$IS_PRERELEASE" = true ]; then latest=false; fi
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --draft=false --prerelease="$IS_PRERELEASE" --latest="$latest"
